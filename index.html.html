<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多森よもぎ専用 特典会質問ガチャ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .gacha-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 400px;
      width: 100%;
    }

    .title-section {
      text-align: center;
    }

    .title-text {
      font-size: 28px;
      font-weight: 600;
      color: #3d7a3d;
      margin-bottom: 8px;
    }

    .subtitle-text {
      font-size: 16px;
      color: #6ba56b;
      font-weight: 500;
    }

    .gacha-machine {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      background: white;
      border: 2px solid #6ba56b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .gacha-display {
      width: 85%;
      height: 85%;
      background: white;
      border: 3px solid #a8d5a8;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      min-height: 200px;
    }

    .gacha-display.spinning {
      animation: spin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes spin {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    .gacha-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .gacha-label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .gacha-question {
      font-size: 22px;
      font-weight: 500;
      color: #333;
      line-height: 1.4;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 280px;
    }

    .gacha-button {
      padding: 1.2rem 2rem;
      font-size: 18px;
      font-weight: 700;
      border: none;
      background: #4da94d;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .gacha-button:hover:not(:disabled) {
      background: #3d8d3d;
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .gacha-button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .gacha-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-button {
      padding: 1rem 1.5rem;
      font-size: 16px;
      background: white;
      color: #4da94d;
      border: 2px solid #4da94d;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-weight: 600;
    }

    .reset-button:hover {
      border-color: #3d8d3d;
      background: #f0f8f0;
    }
  </style>
</head>
<body>
  <div class="gacha-container">
    <div class="title-section">
      <p class="title-text">多森よもぎ専用</p>
      <p class="subtitle-text">特典会質問ガチャ 🌿</p>
    </div>

    <div class="gacha-machine">
      <div class="gacha-display" id="display">
        <div class="gacha-icon">🌿</div>
        <div class="gacha-label">特典会質問ガチャ</div>
        <div class="gacha-question">まわしてね！</div>
      </div>
    </div>

    <div class="button-group">
      <button class="gacha-button" id="gachaBtn" onclick="spinGacha()">
        ガチャをまわす
      </button>
      <button class="reset-button" id="resetBtn" onclick="resetDisplay()" style="display: none;">
        別のお題を引く
      </button>
    </div>
  </div>

  <script>
    const questions = [
      "今日の朝ごはんは何食べました？",
      "最近ハマってる食べ物ってありますか？",
      "好きなチョコ系のお菓子は何ですか？",
      "コンビニで買える好きなお菓子は？",
      "好きなラーメンの種類は？",
      "ドーナツのおすすめの食べ方ってありますか？",
      "好きなドリンクは何ですか？",
      "予算1500円だったら、白ご飯のおかずに何にしますか？",
      "予算500円だったら、白ご飯のおかずに何にしますか？",
      "予算1000円だったら、白ご飯のおかずに何にしますか？",
      "おにぎりの具材でなにが好き？",
      "オタクとオフ会するならどんな店が良い？",
      "新しくコスプレしてみたい衣装ってありますか？",
      "散歩の時に最近見つけた好きな景色は？",
      "最近見た月の話を聞かせてください",
      "一番好きなコールは何ですか？",
      "ステージから見えるファンの様子で嬉しいことは？",
      "最近のステージでハプニングはありましたか？",
      "気になるアニメはありますか？",
      "最近一番笑ったことは？",
      "最近買った物で気に入ったことはありますか？",
      "私の手相を見てください。恋愛運について特に知りたいです。",
      "私の手相を見てください。結婚できるか、できるなら何歳なのか知りたいです。",
      "あっち向いてホイしましょう。よもぎが勝ったら秘密を教えてください。よもぎが負けたら秘密を当てます。",
      "腕相撲しましょう。よもぎが勝ったらアナタの秘密教えてください。よもぎが負けたらアナタの秘密を当てます。"
    ];

    const display = document.getElementById('display');
    const gachaBtn = document.getElementById('gachaBtn');
    const resetBtn = document.getElementById('resetBtn');
    let lastQuestion = null;

    function getRandomQuestion() {
      let newQuestion;
      do {
        newQuestion = questions[Math.floor(Math.random() * questions.length)];
      } while (newQuestion === lastQuestion && questions.length > 1);
      lastQuestion = newQuestion;
      return newQuestion;
    }

    function spinGacha() {
      gachaBtn.disabled = true;
      resetBtn.style.display = 'none';
      const displayDiv = display.querySelector('.gacha-display') || display;
      displayDiv.classList.add('spinning');

      setTimeout(() => {
        const question = getRandomQuestion();
        const questionDiv = display.querySelector('.gacha-question');
        
        if (questionDiv) {
          questionDiv.textContent = question;
        }
        
        displayDiv.classList.remove('spinning');
        gachaBtn.disabled = false;
        resetBtn.style.display = 'block';
      }, 600);
    }

    function resetDisplay() {
      spinGacha();
    }
  </script>
</body>
</html>
